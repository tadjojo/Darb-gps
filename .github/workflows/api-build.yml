
name: DARB GPS API Build

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: api
        run: npm install

      - name: Build API
        working-directory: api
        run: npm run build
