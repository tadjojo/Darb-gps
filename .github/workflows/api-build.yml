name: DARB GPS API Build

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "app.js"
      - "simulate-tracker.mjs"
      - "test-tracker-simulator.mjs"
      - "package.json"
      - "gateway/gt06/**"
      - ".github/workflows/api-build.yml"
      - ".github/workflows/static.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "gateway/gt06/**"
      - ".github/workflows/api-build.yml"
      - ".github/workflows/static.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: api
        run: npm install

      - name: Build API and run GPS protocol parser tests
        working-directory: api
        run: npm run test:protocols

      - name: Validate web application JavaScript syntax
        run: node --check app.js

      - name: Test tracker simulator API contracts
        run: node test-tracker-simulator.mjs

      - name: Test GT06 TCP gateway source filtering
        run: node --test gateway/gt06/test/server.test.cjs

      - name: Test TCP gateway healthcheck
        run: node --test gateway/gt06/test/healthcheck.test.cjs

      - name: Validate TCP gateway Compose deployment
        run: |
          cp gateway/gt06/deploy/.env.example gateway/gt06/deploy/.env
          docker compose -f gateway/gt06/deploy/docker-compose.yml config --quiet

      - name: Build TCP gateway container image
        run: docker build -f gateway/gt06/Dockerfile -t darb-gps-tcp-gateway:ci .
