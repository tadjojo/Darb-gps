name: DARB GPS Production API Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check API liveness
        run: |
          response="$(curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 -fsS https://darb-gps-x.onrender.com/api/v1/health/live)"
          echo "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="ok") process.exit(1)' "$response"
      - name: Check database readiness
        run: |
          response="$(curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 -fsS https://darb-gps-x.onrender.com/api/v1/health/ready)"
          echo "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="ready" || x.database!=="connected") process.exit(1)' "$response"
      - name: Check protected endpoints reject anonymous requests
        run: |
          status="$(curl --max-time 30 -sS -o /tmp/anonymous.json -w '%{http_code}' https://darb-gps-x.onrender.com/api/v1/organizations -H 'Content-Type: application/json' -d '{"name":"anonymous-smoke"}')"
          cat /tmp/anonymous.json
          test "$status" = "401"
      - name: Check GPS credential rotation endpoint rejects anonymous requests
        run: |
          status="$(curl --max-time 30 -sS -o /tmp/gps-rotation-anonymous.json -w '%{http_code}' -X POST https://darb-gps-x.onrender.com/api/v1/tracking/devices/gps/00000000-0000-4000-8000-000000000001/rotate-credential)"
          cat /tmp/gps-rotation-anonymous.json
          test "$status" = "401"
      - name: Check GPS device management endpoints reject anonymous requests
        run: |
          device_id="00000000-0000-4000-8000-000000000001"
          for endpoint in "tracking/devices/gps" "tracking/devices/gps/$device_id/revoke"; do
            status="$(curl --max-time 30 -sS -o /tmp/gps-management.json -w '%{http_code}' -X POST "https://darb-gps-x.onrender.com/api/v1/$endpoint" -H 'Content-Type: application/json' -d '{"vehicleId":"00000000-0000-4000-8000-000000000002","protocol":"json"}')"
            test "$status" = "401"
          done
      - name: Check all HTTP GPS ingestion protocols reject invalid credentials
        run: |
          base="https://darb-gps-x.onrender.com/api/v1/device-gateway"
          auth='Authorization: Bearer invalid-smoke-credential'
          recorded_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          status="$(curl --max-time 30 -sS -o /tmp/gps-ingest.json -w '%{http_code}' -X POST "$base/ingest" -H "$auth" -H 'Content-Type: application/json' -d "{\"latitude\":31.9539,\"longitude\":35.9106,\"recordedAt\":\"$recorded_at\"}")"
          test "$status" = "401"
          status="$(curl --max-time 30 -sS -o /tmp/gps-nmea.json -w '%{http_code}' -X POST "$base/ingest/nmea" -H "$auth" -H 'Content-Type: application/json' -d '{"sentence":"$GPRMC,123519,A,4807.038,N,01131.000,E,022.4,084.4,230394,003.1,W*6A"}')"
          test "$status" = "401"
          status="$(curl --max-time 30 -sS -o /tmp/gps-gt06.json -w '%{http_code}' -X POST "$base/ingest/gt06" -H "$auth" -H 'Content-Type: application/json' -d '{"frameHex":"78780D010353419032332707004B7DB80D0A"}')"
          test "$status" = "401"
          status="$(curl --max-time 30 -sS -o /tmp/gps-heartbeat.json -w '%{http_code}' -X POST "$base/heartbeat/gt06" -H "$auth")"
          test "$status" = "401"
      - name: Check login endpoint reaches Supabase Auth
        run: |
          status="$(curl --max-time 30 -sS -o /tmp/login.json -w '%{http_code}' -X POST https://darb-gps-x.onrender.com/api/v1/auth/login -H 'Content-Type: application/json' -d '{"identifier":"darb-smoke-00000000@example.invalid","password":"DarbSmokeInvalidPassword_2026!"}')"
          cat /tmp/login.json
          test "$status" = "401"
      - name: Check new alert endpoints reject anonymous requests
        run: |
          for endpoint in alerts alerts/rules; do
            status="$(curl --max-time 30 -sS -o /tmp/alerts.json -w '%{http_code}' "https://darb-gps-x.onrender.com/api/v1/$endpoint")"
            test "$status" = "401"
          done
      - name: Check web-origin CORS preflight
        run: |
          headers="$(mktemp)"
          status="$(curl --max-time 30 -sS -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS https://darb-gps-x.onrender.com/api/v1/auth/login -H 'Origin: https://darb-gps-web.onrender.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')"
          cat "$headers"
          test "$status" = "204" || test "$status" = "200"
          grep -i '^access-control-allow-origin: https://darb-gps-web.onrender.com' "$headers"
