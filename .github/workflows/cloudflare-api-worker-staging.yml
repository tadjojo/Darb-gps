name: Deploy DARB GPS API to Cloudflare Staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: Confirm deployment to the staging Worker (never production)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    if: inputs.confirm_staging_deploy == true
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    defaults:
      run:
        working-directory: cloudflare/api-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Validate Worker bundle
        run: npm run check
      - name: Deploy staging Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
