name: Deploy DARB GPS API to Cloudflare Staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: Confirm deployment to the staging Worker (never production)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    if: inputs.confirm_staging_deploy == true
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    defaults:
      run:
        working-directory: cloudflare/api-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Validate Worker bundle
        run: npm run check
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy staging Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test deployed Worker liveness
        run: |
          subdomain=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(j.success&&j.result?.subdomain)process.stdout.write(j.result.subdomain);else process.exit(2);})")
          test -n "$subdomain"
          api_url="https://darb-gps-free-api.$subdomain.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused "$api_url/api/v1/health/live"
          echo "Staging Worker liveness passed at $api_url"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
