name: Deploy DARB GPS static dashboard to Cloudflare Pages (staging)

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: Confirm publishing the static demo dashboard to a separate Pages staging project
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-static-preview:
    if: inputs.confirm_staging_deploy == true
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare static site bundle
        run: |
          mkdir -p dist-web
          cp index.html app.js styles.css dist-web/
      - name: Verify site assets
        run: |
          test -s dist-web/index.html
          test -s dist-web/app.js
          test -s dist-web/styles.css
      - name: Check Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy staging Pages project
        run: npx wrangler pages deploy dist-web --project-name darb-gps-web-staging --branch staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
