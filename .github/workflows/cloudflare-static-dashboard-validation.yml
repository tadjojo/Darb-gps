name: DARB GPS static dashboard validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [cloudflare-free-api-migration-next]

permissions:
  contents: read

jobs:
  validate-static-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required assets
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Prepare and verify Pages bundle
        run: |
          mkdir -p dist-web
          cp index.html app.js styles.css dist-web/
          test -s dist-web/index.html
          test -s dist-web/app.js
          test -s dist-web/styles.css
