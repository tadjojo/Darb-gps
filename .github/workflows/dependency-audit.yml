name: DARB GPS Dependency Security Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/package.json"
      - "api/package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/package.json"
      - "api/package-lock.json"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Audit all dependencies (report)
        shell: bash
        run: |
          npm audit --json > ../npm-audit-all.json || true
      - name: Audit production dependencies (blocking)
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=low --json > ../npm-audit-production.json
          audit_status=$?
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("../npm-audit-production.json", "utf8"));
            const v = report.metadata?.vulnerabilities ?? {};
            console.log("Production dependency vulnerabilities:", JSON.stringify(v));
          '
          exit "$audit_status"
      - name: Reject high and critical vulnerabilities in all dependencies
        run: npm audit --audit-level=high
      - name: Print full dependency audit summary
        if: always()
        run: |
          node -e '
          const fs = require("node:fs");
          for (const file of ["../npm-audit-production.json", "../npm-audit-all.json"]) {
            if (!fs.existsSync(file)) continue;
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            const v = report.metadata?.vulnerabilities ?? {};
            console.log(file, JSON.stringify(v));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via:item.via}));
            }
          }'
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darb-gps-dependency-audit
          path: |
            npm-audit-production.json
            npm-audit-all.json
          if-no-files-found: warn
          retention-days: 14
