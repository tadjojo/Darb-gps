name: DARB GPS iOS CI

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-simulator.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

jobs:
  ios-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS runner
        run: flutter create --platforms=ios --org com.darb --project-name darb_gps .
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test --reporter expanded
      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: darb-gps-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 14
