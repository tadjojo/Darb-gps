name = "darb-gps-free-api"
main = "src/index.mjs"
compatibility_date = "2026-11-25"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://tadjojo.github.io,https://darb-gps-web-2026.tadjojo.workers.dev"

[observability]
enabled = true

# Per-location approximate limits for abuse mitigation.
[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "7311001"

[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "TRACKER_RATE_LIMIT"
namespace_id = "7311002"

[ratelimits.simple]
limit = 120
period = 60
