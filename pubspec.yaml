name: darb_gps
description: DARB GPS mobile app - phase 2 map and tracking integration starter.
publish_to: 'none'
version: 0.2.1+3
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geolocator_android: ^4.3.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  socket_io_client: ^3.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
